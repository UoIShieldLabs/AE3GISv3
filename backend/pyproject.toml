[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, UP pyupgrade, B bugbear.
# E501 (line length) is left to the formatter — it cannot break string literals.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

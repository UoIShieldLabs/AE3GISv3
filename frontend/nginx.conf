map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API and WebSocket proxy to backend
    location /api/v1/topologies/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Live pcap streams (`curl -N …/pcap?follow=true | wireshark -k -i -`):
    # pass packets through as they arrive, and let a quiet capture idle for hours.
    location ~ ^/api/v1/captures/[^/]+/pcap$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400;
        gzip off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        # Disable nginx gzip for proxied API responses — the proxy already
        # handles decompression/re-encoding and double-compression breaks clients.
        gzip off;
        proxy_set_header Accept-Encoding "";
    }

    # Build output: names carry a content hash, so cache them for good. A name
    # this build doesn't have is a 404, never index.html: a stale page asking
    # for the previous build's chunks must not get HTML back as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. The page is always revalidated (a 304 when unchanged), so
    # after a rebuild the browser loads the new chunk names instead of a cached
    # index.html pointing at ones that are gone (a blank page).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

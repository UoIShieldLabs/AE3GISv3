services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Kathara + the terminal bridge talk to the host Docker daemon through the
      # socket. No privileged mode, no host netns, no host pid — Kathara creates
      # collision domains as ordinary Docker bridge networks.
      - /var/run/docker.sock:/var/run/docker.sock
      - ae3gis-data:/app/data
      # Dev live-reload: mount source and run uvicorn --reload (see command).
      - ./backend:/app
    environment:
      - AE3GIS_DB_PATH=/app/data/ae3gis.db
      - AE3GIS_INSTRUCTOR_TOKEN=${AE3GIS_INSTRUCTOR_TOKEN:-test}
      - AE3GIS_CORS_ORIGINS=${AE3GIS_CORS_ORIGINS:-*}
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  ae3gis-data:
